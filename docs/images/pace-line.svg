<text x="70" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#26231f">Work follows a straight line through the week</text>
<text x="70" y="48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6f675d">Account usage in one 7-day window, checked every half hour by the dispatch gate. Fictional data.</text>
