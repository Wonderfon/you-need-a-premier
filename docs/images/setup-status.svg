<text x="403" y="21" fill="#9aa0aa" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" text-anchor="middle">guided setup: stop any time, continue from the saved files</text>
<text x="20" y="56" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#f0f3f6">python -m orgcore setup my-org save lines --file lines.json</tspan></text>
