<text x="20" y="623" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve"># Seed Packet Sorting Checklist</text>
<text x="20" y="644" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve"></text>
<text x="20" y="665" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">- [ ] 1. Gather every seed packet in one place.</text>
<text x="20" y="686" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">- [ ] 2. Read each packet&#x27;s back and note its recommended sowing month.</text>
<text x="20" y="707" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">- [ ] 3. Set out twelve labeled envelopes or dividers, one for each month.</text>
<text x="20" y="728" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">- [ ] 4. File each packet behind the month it should be sown.</text>
<text x="20" y="749" fill="#c9d1d9" font-family="Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">- [ ] 5. Store the sorted packets somewhere cool and dry.</text>
<text x="20" y="794" fill="#8b949e" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12">A real run on a fictional garden task (docs/real-run). Two real Claude sessions; the usage figure is whole percent points.</text>
